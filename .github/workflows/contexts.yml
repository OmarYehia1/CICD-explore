name: Contexts Playground

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: calculator

jobs:
  explore:
    runs-on: ubuntu-latest
    env:
      STAGE: test
    steps:
      - name: Variables at different levels
        env:
          STAGE: override
        run: echo "$APP_NAME / $STAGE"

      - name: Default variables vs contexts
        run: |
          echo "Shell variable:  $GITHUB_REPOSITORY @ $GITHUB_SHA"
          echo "Expression:      ${{ github.repository }} @ ${{ github.sha }}"
          echo "Runner OS:       ${{ runner.os }}"
          echo "Run number:      ${{ github.run_number }}"

      - name: Dump the whole github context (great for discovering fields)
        env:
          GITHUB_CONTEXT: ${{ toJSON(github) }}
        run: echo "$GITHUB_CONTEXT"
      

      - name: Only on main
        if: github.ref == 'refs/heads/main'
        run: echo "We are on main"

      - name: Only when triggered manually
        if: github.event_name == 'workflow_dispatch'
        run: echo "Somebody clicked the button"

      - name: Only if the commit message contains [deploy]
        if: contains(github.event.head_commit.message, '[deploy]')
        run: echo "Deploy requested via commit message"
        
      - name: Compute a short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Use it
        run: echo "Building version $SHORT_SHA"

  version:
    runs-on: ubuntu-latest
    outputs:                                    # expose to other jobs
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Compute version
        id: ver                                 # id is required to reference the step
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Use it in the same job
        run: echo "Version is ${{ steps.ver.outputs.version }}"

  release-notes:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Use it from another job
        run: echo "Preparing release ${{ needs.version.outputs.version }}"

      - name: Write a job summary
        run: |
          {
            echo "## 🚀 Release ${{ needs.version.outputs.version }}"
            echo ""
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Actor | @${GITHUB_ACTOR} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Print PR Title
        env:
         PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "PR title: $PR_TITLE"